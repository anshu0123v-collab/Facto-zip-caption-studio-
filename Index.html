
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACTO ZIP CAPTION STUDIO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101321;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 12px;background:#191e32;border-bottom:2px solid #6c63ff}
header h1{margin:0;color:#a99cff;font-size:27px}
header p{color:#c4c6d5}
main{max-width:700px;margin:25px auto;padding:15px}
.panel{background:#1b2035;padding:20px;border-radius:16px;margin-bottom:18px}
h2{font-size:19px;color:#b5aaff}
label{display:block;margin:15px 0 7px;color:#ddd}
input,select,textarea{width:100%;padding:12px;border:1px solid #444b68;border-radius:9px;background:#101526;color:white}
button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:10px;background:#7568ff;color:white;font-weight:bold;font-size:16px}
video{width:100%;margin-top:15px;border-radius:10px;background:#080a12}
.note{color:#bfc2d4;font-size:13px;line-height:1.5}
#status{color:#b8aaff;margin-top:12px}
footer{text-align:center;padding:20px;color:#999;font-size:13px}
</style>
</head>
<body>
<header>
<h1>FACTO ZIP</h1>
<p>CAPTION STUDIO</p>
</header>
<main>
<div class="panel">
<h2>Upload Your Video</h2>
<label>Select video</label>
<input type="file" id="videoFile" accept="video/*">
<video id="videoPreview" controls playsinline></video>
</div>

<div class="panel">
<h2>Caption Settings</h2>
<label>Caption Language</label>
<select id="language">
<option>Hindi</option>
<option>English</option>
<option>Hinglish</option>
</select>

<label>Caption Style</label>
<select id="style">
<option>Normal Subtitles</option>
<option>Bold Captions</option>
<option>Word Highlight</option>
<option>Multi Colour</option>
<option>Animated Captions</option>
</select>

<label>Caption Colour</label>
<select id="colour">
<option>White</option>
<option>Yellow</option>
<option>Cyan</option>
<option>Green</option>
</select>
<p class="note">Automatic speech recognition will be connected in a later development step.</p>
<button onclick="generate()">Generate Captions</button>
<p id="status"></p>
</div>

<div class="panel">
<h2>Edit Captions</h2>
<textarea id="captions" rows="6" placeholder="Your captions will appear here..."></textarea>
<button onclick="downloadSRT()">Download SRT</button>
</div>
</main>
<footer>FACTO ZIP CAPTION STUDIO © 2026</footer>

<script>
const fileInput=document.getElementById("videoFile");
const preview=document.getElementById("videoPreview");
fileInput.addEventListener("change",function(){
if(this.files && this.files[0]){
preview.src=URL.createObjectURL(this.files[0]);
}
});

function generate(){
document.getElementById("status").textContent=
"Caption engine is not connected yet. You can edit captions manually below.";
}

function downloadSRT(){
const text=document.getElementById("captions").value.trim();
if(!text){alert("Please enter captions first.");return;}
const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="factozip-captions.srt";
link.click();
URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>
